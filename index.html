function toRgbTriplet(hex){
  const clean=hex.replace("#","").trim();
  const full=clean.length===3 ? clean.split("").map(ch=>ch+ch).join("") : clean;
  const int=parseInt(full,16);
  return `${(int>>16)&255},${(int>>8)&255},${int&255}`;
}

function applyAccent(hex){
  state.accent=hex;
  document.documentElement.style.setProperty("--accent", hex);
  document.documentElement.style.setProperty("--accent-rgb", toRgbTriplet(hex));
  const picker=document.getElementById("accentPicker");
  if(picker && picker.value.toLowerCase()!==hex.toLowerCase()) picker.value=hex;
}

function displayLinkLabel(label){
  return state.lang==="en" ? (LINK_LABEL_EN[label] || label) : label;
}

function ambientHtml(year){
  const files=AMBIENT_FILES[year] || [];
  if(!files.length) return "";
  const items=files.map((url, idx)=>`
    <div class="ambient-item" data-index="${idx}">
      <img class="ambient-media" src="${url}" alt="" draggable="false">
    </div>
  `).join("");
  return `<div class="year-ambient" aria-hidden="true">${items}</div>`;
}

let ambientControllers=[];

function stopAmbientControllers(){
  ambientControllers.forEach(controller=>controller.stop());
  ambientControllers=[];
}

function seedRandom(seed){
  let s=(seed >>> 0) || 1;
  return function(){
    s = (s * 1664525 + 1013904223) >>> 0;
    return s / 4294967296;
  };
}

function initAmbient(page, year){
  const layer=page.querySelector(".year-ambient");
  if(!layer) return;

  const items=[...layer.querySelectorAll(".ambient-item")];
  if(!items.length) return;

  let raf=0;
  let stopped=false;
  let lastTime=performance.now();
  const states=[];
  const rand=seedRandom(year * 7919 + 41);

  const MIN_WIDTH=70;
const MAX_WIDTH=140;
  const EDGE_PAD=8;

  function bounds(){
    const width=Math.max(1,page.clientWidth);
    const height=Math.max(page.clientHeight,page.scrollHeight);
    layer.style.width=width+"px";
    layer.style.height=height+"px";
    return {width,height};
  }

  function choosePlacement(w,h,index){
    const b=bounds();
    const maxX=Math.max(EDGE_PAD,b.width-w-EDGE_PAD);
    const maxY=Math.max(EDGE_PAD,b.height-h-EDGE_PAD);

    const cols=4;
    const rows=Math.max(2,Math.ceil(items.length/cols));
    const cell=index % (cols*rows);
    const col=cell % cols;
    const row=Math.floor(cell/cols);
    const cellW=(maxX-EDGE_PAD)/Math.max(1,cols);
    const cellH=(maxY-EDGE_PAD)/Math.max(1,rows);

    let x=EDGE_PAD + col*cellW + rand()*Math.max(10,cellW*.82);
    let y=EDGE_PAD + row*cellH + rand()*Math.max(10,cellH*.78);
    x=Math.min(maxX,Math.max(EDGE_PAD,x));
    y=Math.min(maxY,Math.max(EDGE_PAD,y));
    return {x,y};
  }

  function randomDriftVelocity(){
    const angle=rand()*Math.PI*2;
    const speed=13 + rand()*15; // slow, visible swimming
    return {
      vx:Math.cos(angle)*speed,
      vy:Math.sin(angle)*speed
    };
  }

  items.forEach((item,index)=>{
    const img=item.querySelector(".ambient-media");
    const state={
      item,img,index,
      x:0,y:0,w:MIN_WIDTH,h:MIN_WIDTH*.55,
      vx:0,vy:0,
      phase:rand()*Math.PI*2,
      phase2:rand()*Math.PI*2,
      freq:.18 + rand()*.28,
      freq2:.13 + rand()*.23,
      lastRepel:0,
      ready:false
    };
    states.push(state);

    const prepare=()=>{
      if(stopped || state.ready) return;

      const naturalW=Math.max(1,img.naturalWidth || MIN_WIDTH);
      const naturalH=Math.max(1,img.naturalHeight || naturalW*.55);


      const slightScale=1 + rand()*.12;
      const targetW=Math.min(
        MAX_WIDTH,
        Math.max(MIN_WIDTH, naturalW * slightScale)
      );
      const targetH=targetW * (naturalH/naturalW);

      state.w=targetW;
      state.h=targetH;
      item.style.width=targetW.toFixed(1)+"px";
      item.style.height=targetH.toFixed(1)+"px";

      const p=choosePlacement(state.w,state.h,index);
      state.x=p.x;
      state.y=p.y;
      const drift=randomDriftVelocity();
      state.vx=drift.vx;
      state.vy=drift.vy;
      state.ready=true;

      item.style.transform=`translate3d(${state.x}px,${state.y}px,0)`;
      const revealDelay=Math.round(rand()*900);
      window.setTimeout(()=>{
        if(!stopped) item.classList.add("ready");
      },revealDelay);
    };

    if(img.complete && img.naturalWidth) prepare();
    else img.addEventListener("load",prepare,{once:true});

    function repel(e,strong=true){
      if(!state.ready) return;
      const now=performance.now();
      if(!strong && now-state.lastRepel<85) return;
      state.lastRepel=now;

      const rect=item.getBoundingClientRect();
      const cx=rect.left+rect.width/2;
      const cy=rect.top+rect.height/2;
      let dx=cx-e.clientX;
      let dy=cy-e.clientY;
      let len=Math.hypot(dx,dy);

      if(len<4){
        const a=rand()*Math.PI*2;
        dx=Math.cos(a);
        dy=Math.sin(a);
        len=1;
      }

      dx/=len;
      dy/=len;


      const impulse=(strong ? 270 : 120) + rand()*(strong ? 250 : 130);
      state.vx += dx*impulse;
      state.vy += dy*impulse;

      const tangent=(rand()-.5)*(strong ? 190 : 90);
      state.vx += -dy*tangent;
      state.vy += dx*tangent;
    }

    item.addEventListener("mouseenter",e=>repel(e,true));
    item.addEventListener("mousemove",e=>repel(e,false));
  });

  function tick(now){
    if(stopped) return;
    const dt=Math.min(.032,Math.max(.001,(now-lastTime)/1000));
    lastTime=now;

    const pageDistance=Math.abs(page.offsetLeft-viewport.scrollLeft);
    const active=pageDistance < viewport.clientWidth*.78;

    if(active){
      const b=bounds();
      states.forEach(s=>{
        if(!s.ready) return;

    
        const t=now/1000;
        s.vx += Math.sin(t*s.freq+s.phase)*4.4*dt;
        s.vy += Math.cos(t*s.freq2+s.phase2)*4.0*dt;

    
        const speed=Math.hypot(s.vx,s.vy);
        if(speed>48){
          const decay=Math.pow(.955,dt*60);
          s.vx*=decay;
          s.vy*=decay;
        }else if(speed<10){
          const drift=randomDriftVelocity();
          s.vx += drift.vx*.12;
          s.vy += drift.vy*.12;
        }

        s.x += s.vx*dt;
        s.y += s.vy*dt;

        const minX=EDGE_PAD;
        const minY=EDGE_PAD;
        const maxX=Math.max(minX,b.width-s.w-EDGE_PAD);
        const maxY=Math.max(minY,b.height-s.h-EDGE_PAD);

        // Hard page borders: images always stay fully inside the year page.
        if(s.x<minX){
          s.x=minX;
          s.vx=Math.abs(s.vx)*(.78+rand()*.14);
        }else if(s.x>maxX){
          s.x=maxX;
          s.vx=-Math.abs(s.vx)*(.78+rand()*.14);
        }
        if(s.y<minY){
          s.y=minY;
          s.vy=Math.abs(s.vy)*(.78+rand()*.14);
        }else if(s.y>maxY){
          s.y=maxY;
          s.vy=-Math.abs(s.vy)*(.78+rand()*.14);
        }

        s.item.style.transform=`translate3d(${s.x.toFixed(2)}px,${s.y.toFixed(2)}px,0)`;
      });
    }

    raf=requestAnimationFrame(tick);
  }

  raf=requestAnimationFrame(tick);

  const controller={
    stop(){
      stopped=true;
      if(raf) cancelAnimationFrame(raf);
    }
  };
  ambientControllers.push(controller);
  return controller;
}

function archiveHref(original) {
  const normalized=/^https?:\/\//i.test(original) ? original : "http://"+original;
  if(/^https?:\/\/web\.archive\.org\/web\//i.test(normalized)) return normalized;
  return "https://web.archive.org/web/*/"+normalized;
}

function projectLink(link) {
  const href = archiveHref(link.url);
  const label = displayLinkLabel(link.label);
  return `<a
    class="project"
    href="${href}"
    target="_blank"
    rel="noopener"
    title="Web Archive: ${link.url}"
  >${label} ↗</a>`;
}

function columnCount(n) {
  if (n <= 5) return 1;
  if (n <= 8) return 2;
  return 3;
}

function splitChronologically(items, count) {
  const result=[];
  const base=Math.floor(items.length/count);
  const extra=items.length%count;
  let cursor=0;

  for(let c=0;c<count;c++) {
    const size=base+(c<extra?1:0);
    result.push(items.slice(cursor,cursor+size));
    cursor+=size;
  }
  return result;
}

const RU_MONTHS={
  "январь":"01","января":"01",
  "февраль":"02","февраля":"02",
  "март":"03","марта":"03",
  "апрель":"04","апреля":"04",
  "май":"05","мая":"05",
  "июнь":"06","июня":"06",
  "июль":"07","июля":"07",
  "август":"08","августа":"08",
  "сентябрь":"09","сентября":"09",
  "октябрь":"10","октября":"10",
  "ноябрь":"11","ноября":"11",
  "декабрь":"12","декабря":"12"
};

function monthNumber(word){
  return RU_MONTHS[(word||"").toLowerCase()] || null;
}

function padDay(value){
  const n=String(value).replace(/^0+/,"");
  return n || "0";
}

function dateCodeFromRussian(raw){
  const s=(raw||"").toLowerCase().trim().replace(/\s+/g," ");

  const one=(value)=>({lines:[value,""]});
  const two=(first,second)=>({lines:[first,second]});

  // Vague/non-calendar date: keep the agreed /! marker.
  if(/^\d{4}$/.test(s)) return one("/!");
  if(/^(конец|середина)\s+года$/.test(s)) return one("/!");

  // конец марта / начало марта -> /03
  let edge=s.match(/^(?:конец|начало)\s+([а-яё]+)$/i);
  if(edge){
    const mm=monthNumber(edge[1]);
    if(mm) return one(`/${mm}`);
  }

  // 15 июня — август -> 15/06–  | /08
  let m=s.match(/^(\d{1,2})\s+([а-яё]+)\s*[—–-]\s*([а-яё]+)$/i);
  if(m){
    const m1=monthNumber(m[2]), m2=monthNumber(m[3]);
    if(m1&&m2) return two(`${padDay(m[1])}/${m1}–`,`/${m2}`);
  }

  // март — 1 апреля -> /03– | 1/04
  m=s.match(/^([а-яё]+)\s*[—–-]\s*(\d{1,2})\s+([а-яё]+)$/i);
  if(m){
    const m1=monthNumber(m[1]), m2=monthNumber(m[3]);
    if(m1&&m2) return two(`/${m1}–`,`${padDay(m[2])}/${m2}`);
  }

  // 19 августа — 4 сентября -> 19/08– | 4/09
  m=s.match(/^(\d{1,2})\s+([а-яё]+)\s*[—–-]\s*(\d{1,2})\s+([а-яё]+)$/i);
  if(m){
    const m1=monthNumber(m[2]), m2=monthNumber(m[4]);
    if(m1&&m2) return two(`${padDay(m[1])}/${m1}–`,`${padDay(m[3])}/${m2}`);
  }

  // 8–21 ноября / 8 / 21 ноября -> 8–21 | /11
  m=s.match(/^(\d{1,2})\s*(?:\/|—|–|-)\s*(\d{1,2})\s+([а-яё]+)$/i);
  if(m){
    const mm=monthNumber(m[3]);
    if(mm) return two(`${padDay(m[1])}–${padDay(m[2])}`,`/${mm}`);
  }

  // 28 августа -> 28/08
  m=s.match(/^(\d{1,2})\s+([а-яё]+)$/i);
  if(m){
    const mm=monthNumber(m[2]);
    if(mm) return one(`${padDay(m[1])}/${mm}`);
  }

  // март — апрель -> /03– | /04
  m=s.match(/^([а-яё]+)\s*[—–-]\s*([а-яё]+)$/i);
  if(m){
    const m1=monthNumber(m[1]), m2=monthNumber(m[2]);
    if(m1&&m2) return two(`/${m1}–`,`/${m2}`);
  }

  // январь -> /01
  m=s.match(/^([а-яё]+)$/i);
  if(m){
    const mm=monthNumber(m[1]);
    if(mm) return one(`/${mm}`);
  }

  return one("/!");
}

function dateMarkup(ev){
  const code=dateCodeFromRussian(ev.date.ru);
  const first=code.lines[0] || "";
  const second=code.lines[1] || "";
  return `<div class="date-code">
    <span class="date-line">${first}</span>
    <span class="date-line ${second ? "" : "empty"}">${second || "—"}</span>
  </div>`;
}

function eventHtml(ev) {
  const links=(ev.links||[]).map(projectLink).join("");
  return `<li class="event">
    <div class="event-date">${dateMarkup(ev)}</div>
    <div class="event-copy">
      ${ev.text[state.lang]}
      ${links?`<div class="links">${links}</div>`:""}
    </div>
  </li>`;
}

function render() {
  stopAmbientControllers();
  track.innerHTML="";
  yearNav.innerHTML="";

  DATA.forEach((entry,index)=>{
    const nav=document.createElement("button");
    nav.type="button";
    nav.className="year-btn"+(index===state.current?" active":"");
    nav.textContent=entry.year;
    nav.addEventListener("click",()=>go(index));
    yearNav.appendChild(nav);

    const cols=columnCount(entry.events.length);
    const groups=splitChronologically(entry.events,cols);
    const columns=groups
      .map(group=>`<ol class="event-col">${group.map(eventHtml).join("")}</ol>`)
      .join("");

    const page=document.createElement("section");
    page.className="year-page year-" + entry.year;
    page.dataset.index=index;
    page.innerHTML=`
      ${ambientHtml(entry.year)}
      <div class="year-layout">
        <aside class="year-aside">
          <div class="year-ghost" aria-hidden="true">${entry.year}</div>
          <h2 class="year-number">${entry.year}</h2>
          <div class="year-summary">${entry.summary[state.lang]}</div>
        </aside>
        <div class="event-columns cols-${cols}">
          ${columns}
        </div>
      </div>
    `;
    track.appendChild(page);
    initAmbient(page, entry.year);
  });

  updateHeader();
  requestAnimationFrame(()=>go(state.current,false));
}

function updateHeader() {
  document.documentElement.lang=state.lang;

  document.getElementById("title").textContent=
    state.lang==="ru"
      ? "ЛЕТОПИСЬ РУССКОГО ИНТЕРНЕТА"
      : "CHRONICLE OF THE RUSSIAN INTERNET";

  document.getElementById("subtitle").innerHTML=
    state.lang==="ru"
      ? `интерактивный пересказ Летописи русского интернета <a class="author" href="https://web.archive.org/web/*/https://www.netslova.ru/gorny/" target="_blank" rel="noopener">Евгения Горного</a>`
      : `an interactive retelling of the Chronicle of the Russian Internet by <a class="author" href="https://web.archive.org/web/*/https://www.netslova.ru/gorny/" target="_blank" rel="noopener">Evgeny Gorny</a>`;

  document.getElementById("ru").classList.toggle("active",state.lang==="ru");
  document.getElementById("en").classList.toggle("active",state.lang==="en");
  document.getElementById("colorLabel").textContent = state.lang==="ru" ? "цвет" : "accent";
  document.getElementById("accentPicker").value = state.accent;

  document.querySelectorAll(".year-btn")
    .forEach((btn,i)=>btn.classList.toggle("active",i===state.current));
}

function animateYear(page) {
  if(!page) return;
  page.classList.remove("animate-year");
  void page.offsetWidth;
  page.classList.add("animate-year");
  window.setTimeout(()=>page.classList.remove("animate-year"),7400);
}

function go(index,smooth=true) {
  state.current=Math.max(0,Math.min(DATA.length-1,index));
  const pages=document.querySelectorAll(".year-page");

  pages[state.current]?.scrollIntoView({
    behavior:smooth?"smooth":"auto",
    inline:"start",
    block:"nearest"
  });

  animateYear(pages[state.current]);

  document.querySelectorAll(".year-btn")
    .forEach((btn,i)=>btn.classList.toggle("active",i===state.current));
}

document.getElementById("prev").addEventListener("click",()=>go(state.current-1));
document.getElementById("next").addEventListener("click",()=>go(state.current+1));
document.getElementById("ru").addEventListener("click",()=>{state.lang="ru";render()});
document.getElementById("en").addEventListener("click",()=>{state.lang="en";render()});
document.getElementById("accentPicker").addEventListener("input",(e)=>applyAccent(e.target.value));

viewport.addEventListener("wheel",(e)=>{
  const page=e.target.closest(".year-page");
  const verticalIntent=Math.abs(e.deltaY)>=Math.abs(e.deltaX);

  if(page && verticalIntent){
    const canScrollDown=page.scrollTop+page.clientHeight < page.scrollHeight-2;
    const canScrollUp=page.scrollTop > 2;

    if((e.deltaY>0 && canScrollDown) || (e.deltaY<0 && canScrollUp)){
      // Let the year page consume the wheel event vertically.
      return;
    }

    // At the top/bottom boundary, continue through the timeline horizontally.
    e.preventDefault();
    viewport.scrollLeft+=e.deltaY;
    return;
  }

  if(Math.abs(e.deltaX)>0){
    e.preventDefault();
    viewport.scrollLeft+=e.deltaX;
  }
},{passive:false});

viewport.addEventListener("keydown",(e)=>{
  if(e.key==="ArrowRight"){e.preventDefault();go(state.current+1)}
  if(e.key==="ArrowLeft"){e.preventDefault();go(state.current-1)}
});

viewport.addEventListener("scroll",()=>{
  const pages=[...document.querySelectorAll(".year-page")];
  let closest=0;
  let distance=Infinity;

  pages.forEach((page,i)=>{
    const d=Math.abs(page.offsetLeft-viewport.scrollLeft);
    if(d<distance){
      distance=d;
      closest=i;
    }
  });

  if(closest!==state.current){
    state.current=closest;
    animateYear(pages[state.current]);
    document.querySelectorAll(".year-btn")
      .forEach((btn,i)=>btn.classList.toggle("active",i===state.current));
  }
});

applyAccent(state.accent);
render();
</script>
</body>
</html>
