<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Летопись русского Интернета — 1990–1999</title>

<style>
@font-face {
  font-family:"Tenor Timeline";
  src:url("https://dariaivans.neocities.org/fonts/TenorSans-Regular.ttf") format("truetype");
  font-weight:400;
  font-style:normal;
  font-display:swap;
}
@font-face {
  font-family:"Goudy Timeline";
  src:url("https://dariaivans.neocities.org/fonts/Goudy%20Old%20Style%20Cursive%20.ttf") format("truetype");
  font-weight:400;
  font-style:normal;
  font-display:swap;
}

:root {
  --bg:#FFFCFD;
  --ink:#18191b;
  --muted:#AF1FC2;
  --accent:#29C4D9;
  --head-h:205px;
}

* { box-sizing:border-box; }
html,body {
  margin:0;
  width:100%;
  height:100%;
  background:var(--bg);
  color:var(--ink);
}
body {
  font-family:"Tenor Timeline","Tenor Sans",sans-serif;
  overflow:hidden;
}
button,a {
  font:inherit;
  color:inherit;
}
a { text-decoration:none; }

.header {
  position:fixed;
  inset:0 0 auto 0;
  z-index:100;
  height:var(--head-h);
  padding:27px 58px 0;
  background:
    linear-gradient(
      180deg,
      rgba(41,196,217,.25) 0%,
      rgba(41,196,217,.12) 31%,
      rgba(255,252,253,.96) 73%,
      var(--bg) 100%
    );
}

.top-row {
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  align-items:start;
  gap:32px;
}

.brand {
  min-width:0;
}

.title {
  margin:0;
  white-space:nowrap;
  font-family:"Goudy Timeline","Goudy Old Style",serif;
  font-size:clamp(27px,3.05vw,44px);
  line-height:.92;
  font-weight:400;
  letter-spacing:.002em;
  text-transform:uppercase;
}


.subtitle {
  margin:8px 0 0;
  font-size:15px;
  line-height:1.35;
  color:var(--muted);
}

.author {
  font-family:"Goudy Timeline","Goudy Old Style",serif;
  font-size:20px;
  line-height:1;
  border-bottom:2px solid var(--accent);
  padding:0 2px 1px;
}
.author:hover,
.author:focus {
  background:var(--accent);
  outline:none;
}

.controls {
  display:flex;
  gap:7px;
  align-items:center;
  padding-top:10px;
}

.ctrl {
  height:38px;
  min-width:40px;
  padding:0 10px;
  border:1px solid var(--ink);
  border-radius:0;
  background:rgba(255,252,253,.62);
  cursor:pointer;
  font-size:14px;
}
.ctrl:hover,
.ctrl.active {
  background:var(--accent);
  border-color:var(--ink);
}

.year-nav {
  display:flex;
  gap:5px;
  margin-top:18px;
  padding-bottom:14px;
}

.year-btn {
  min-width:43px;
  padding:5px 8px 4px;
  border:1px solid var(--ink);
  border-radius:0;
  background:rgba(255,252,253,.78);
  cursor:pointer;
  font-size:12px;
}
.year-btn:hover,
.year-btn.active {
  background:var(--accent);
  border-color:#666;
}

.viewport {
  position:fixed;
  left:0;
  right:0;
  top:var(--head-h);
  bottom:0;
  overflow-x:auto;
  overflow-y:hidden;
  scroll-snap-type:x mandatory;
  scrollbar-color:var(--accent) var(--bg);
}

.viewport::-webkit-scrollbar { height:12px; }
.viewport::-webkit-scrollbar-track { background:var(--bg); }
.viewport::-webkit-scrollbar-thumb {
  background:var(--accent);
  border:1px solid var(--ink);
}

.track {
  display:flex;
  width:max-content;
  height:100%;
}

.year-page {
  position:relative;
  flex:0 0 100vw;
  width:100vw;
  height:calc(100vh - var(--head-h));
  scroll-snap-align:start;
  overflow-x:hidden;
  overflow-y:auto;
  overscroll-behavior-y:contain;
  padding:34px 58px 54px;
  border-right:0;
  background:
    radial-gradient(
      ellipse 410px 600px at 0% 100%,
      rgba(41,196,217,.30) 0%,
      rgba(41,196,217,.17) 36%,
      rgba(41,196,217,.06) 60%,
      rgba(41,196,217,0) 78%
    ),
    var(--bg);
}

.year-page::before {
  content:"";
  position:absolute;
  left:0;
  top:0;
  width:44%;
  height:4px;
  background:linear-gradient(
    90deg,
    var(--accent) 0%,
    rgba(41,196,217,.50) 55%,
    transparent 100%
  );
}

.year-layout {
  position:relative;
  z-index:2;
  min-height:100%;
  display:grid;
  grid-template-columns:290px minmax(0,1fr);
  gap:46px;
}

.year-aside {
  position:relative;
  min-width:0;
  overflow:visible;
  padding:24px 34px 0 8px;
  border-right:0;
}


.year-number {
  margin:0 0 26px;
  color:var(--accent);
  font-family:"Tenor Timeline","Tenor Sans",sans-serif;
  font-size:clamp(106px,10vw,158px);
  line-height:.78;
  font-weight:400;
  letter-spacing:.004em;
}

.year-ghost {
  position:absolute;
  left:8px;
  top:24px;
  z-index:-1;
  color:var(--accent);
  font-family:"Tenor Timeline","Tenor Sans",sans-serif;
  font-size:clamp(106px,10vw,158px);
  line-height:.78;
  font-weight:400;
  letter-spacing:.004em;
  pointer-events:none;
  opacity:0;
  filter:blur(0px);
  transform:translateY(0);
  will-change:transform,opacity,filter;
}
.year-page.animate-year .year-ghost {
  animation:year-smear 3.4s cubic-bezier(.2,.65,.25,1) forwards;
}
@keyframes year-smear {
  0% {
    opacity:.34;
    filter:blur(0px);
    transform:translateY(0) scaleY(1);
  }
  30% {
    opacity:.23;
    filter:blur(2px);
    transform:translateY(18px) scaleY(1.03);
  }
  68% {
    opacity:.11;
    filter:blur(5px);
    transform:translateY(55px) scaleY(1.08);
  }
  100% {
    opacity:0;
    filter:blur(9px);
    transform:translateY(94px) scaleY(1.12);
  }
}

.year-summary {
  max-width:225px;
  color:var(--muted);
  font-size:18px;
  line-height:1.5;
}

.event-columns {
  min-width:0;
  height:100%;
  display:grid;
  gap:36px;
  align-content:start;
}

.event-columns.cols-1 { grid-template-columns:minmax(0,900px); }
.event-columns.cols-2 { grid-template-columns:repeat(2,minmax(0,1fr)); }
.event-columns.cols-3 { grid-template-columns:repeat(3,minmax(0,1fr)); gap:28px; }

.event-col {
  list-style:none;
  min-width:0;
  margin:0;
  padding:0;
}

.event {
  display:grid;
  grid-template-columns:94px minmax(0,1fr);
  gap:15px;
  padding:5px 0 12px;
  margin-bottom:22px;
}

.event:last-child {
  border-bottom:0;
}

.event-date {
  padding-top:2px;
  color:var(--muted);
  font-size:15px;
  line-height:1.28;
  text-transform:uppercase;
}

.event-copy {
  min-width:0;
  font-size:16px;
  line-height:1.43;
  overflow-wrap:anywhere;
}

.event-col .event:nth-child(even) .event-copy {
  padding-left:10px;
}
.event-col .event:nth-child(even) .event-date {
  padding-left:4px;
}

.links {
  display:flex;
  flex-wrap:wrap;
  gap:4px 12px;
  margin-top:7px;
}

.project {
  display:inline-block;
  font-family:"Goudy Timeline","Goudy Old Style",serif;
  font-size:20px;
  line-height:1.06;
  border-bottom:2px solid var(--accent);
  padding:0 2px 1px;
}
.project:hover,
.project:focus {
  background:var(--accent);
  outline:none;
}

@media (min-width:1600px) {
  :root { --head-h:205px; }
  .header {
    padding-left:62px;
    padding-right:62px;
  }
  .year-page {
    padding-left:62px;
    padding-right:62px;
  }
  .year-layout {
    grid-template-columns:310px minmax(0,1fr);
    gap:50px;
  }
  .year-summary { font-size:18px; }
  .event-copy { font-size:17px; }
  .project { font-size:21px; }
  .event-columns.cols-3 { gap:31px; }
}

@media (max-width:1320px) {
  :root { --head-h:192px; }
  .header {
    padding:28px 34px 0;
  }
  .title {
    font-size:clamp(29px,3vw,45px);
  }
  .title-rule {
    margin-top:15px;
  }
  .year-nav {
    margin-top:13px;
  }
  .year-page {
    padding:26px 34px 32px;
  }
  .year-layout {
    grid-template-columns:225px minmax(0,1fr);
    gap:28px;
  }
  .year-number,
  .year-ghost {
    font-size:104px;
  }
  .year-summary {
    font-size:15px;
  }
  .event-columns {
    gap:25px;
  }
  .event-columns.cols-3 {
    gap:20px;
  }
  .event {
    grid-template-columns:75px minmax(0,1fr);
    gap:10px;
    padding:4px 0 9px;
    margin-bottom:16px;
  }
  .event-date {
    font-size:13px;
  }
  .event-copy {
    font-size:13.5px;
    line-height:1.34;
  }
  .project {
    font-size:17px;
  }
}

@media (max-width:900px) {
  body {
    overflow:auto;
  }
  :root {
    --head-h:auto;
  }
  .header {
    position:relative;
    height:auto;
    padding:24px 18px 0;
  }
  .top-row {
    grid-template-columns:1fr;
    gap:10px;
  }
  .title {
    white-space:normal;
    font-size:44px;
  }
  .controls {
    padding-top:4px;
  }
  .year-nav {
    overflow-x:auto;
  }
  .viewport {
    position:relative;
    top:auto;
    height:auto;
  }
  .track {
    height:auto;
  }
  .year-page {
    height:auto;
    min-height:calc(100vh - 180px);
    padding:25px 18px 34px;
  }
  .year-layout {
    grid-template-columns:1fr;
    gap:24px;
  }
  .year-aside {
    padding:0 0 22px;
    border-right:0;
  }
    .year-number,
  .year-ghost {
    font-size:96px;
  }
  .year-summary {
    max-width:none;
    font-size:16px;
  }
  .event-columns.cols-1,
  .event-columns.cols-2,
  .event-columns.cols-3 {
    grid-template-columns:1fr;
  }
  .event-copy {
    font-size:15px;
  }
  .project {
    font-size:19px;
  }
}
</style>
</head>

<body>
<header class="header">
  <div class="top-row">
    <div class="brand">
      <h1 class="title" id="title">ЛЕТОПИСЬ РУССКОГО ИНТЕРНЕТА</h1>
      <p class="subtitle" id="subtitle">
        интерактивный пересказ Летописи русского интернета
        <a class="author" href="https://www.netslova.ru/gorny/" target="_blank" rel="noopener">Евгения Горного</a>
      </p>
    </div>

    <div class="controls">
      <button class="ctrl" id="prev" type="button" aria-label="Предыдущий год">←</button>
      <button class="ctrl" id="next" type="button" aria-label="Следующий год">→</button>
      <button class="ctrl active" id="ru" type="button">RU</button>
      <button class="ctrl" id="en" type="button">EN</button>
    </div>
  </div>

  <nav class="year-nav" id="yearNav" aria-label="Годы"></nav>
</header>

<main class="viewport" id="viewport" tabindex="0" aria-label="Горизонтальная летопись">
  <div class="track" id="track"></div>
</main>

<script>
const DATA=[{"year":1990,"summary":{"ru":"Гласнет, Релком, UUCP и домен .SU.","en":"Glasnet, Relcom, UUCP and the .SU domain."},"events":[{"date":{"ru":"январь","en":"January"},"text":{"ru":"Создана общественная организация «Гласнет». При поддержке Association for Progressive Communications она обеспечивала сетевой связью учителей, правозащитников, экологов и другие общественные группы; в 1990 году около 50 пользователей обслуживали три модемные линии.","en":"The public organization Glasnet is created. With support from the Association for Progressive Communications, it provides network access to teachers, human-rights activists, environmentalists and other civic groups; in 1990 about 50 users are served by three modem lines."},"links":[{"label":"Association for Progressive Communications","url":"https://www.apc.org/","archived":false}]},{"date":{"ru":"август","en":"August"},"text":{"ru":"Основана сеть «Релком» — название образовано от RELiable COMmunications. В её создании участвовали специалисты кооператива «Демос», многие из Курчатовского института. К концу года подключены около 30 организаций.","en":"Relcom is founded — its name comes from RELiable COMmunications. Specialists from the Demos cooperative, many from the Kurchatov Institute, take part in its creation. By year’s end about 30 organizations are connected."},"links":[{"label":"Релком","url":"http://www.relcom.ru/","archived":true}]},{"date":{"ru":"1990","en":"1990"},"text":{"ru":"Сеть работает на электронной почте UUCP: почта передаётся между узлами по модему во время сеансов связи, при этом возможна переписка на русском языке.","en":"The network is based on UUCP e-mail: mail is transferred between nodes by modem during connection sessions, with Russian-language correspondence supported."},"links":[]},{"date":{"ru":"28 августа","en":"28 August"},"text":{"ru":"Проведён первый сеанс телекоммуникационной связи с Финляндией по международному телефону. Горный отмечает, что по другим источникам аналогичное событие относят к июлю 1989 года.","en":"The first telecommunications session with Finland is carried out over an international telephone line. Gorny notes that other sources date a comparable event to July 1989."},"links":[]},{"date":{"ru":"19 сентября","en":"19 September"},"text":{"ru":"В базе InterNIC зарегистрирован домен верхнего уровня .SU.","en":"The .SU top-level domain is registered in the InterNIC database."},"links":[]}]},{"year":1991,"summary":{"ru":"TCP/IP, внутренний трафик, C-News и первые русскоязычные непрограммистские телеконференции.","en":"TCP/IP, domestic traffic, C-News and the first Russian-language non-programmer newsgroups."},"events":[{"date":{"ru":"февраль","en":"February"},"text":{"ru":"«Релком» организует первое в России модемное соединение Москва—Барнаул на скорости 9600 бод с использованием TCP/IP.","en":"Relcom establishes what the chronicle calls Russia’s first Moscow–Barnaul modem connection at 9600 baud using TCP/IP."},"links":[{"label":"Релком","url":"http://www.relcom.ru/","archived":true}]},{"date":{"ru":"1 мая","en":"1 May"},"text":{"ru":"Объём информации, пересылаемой внутри России, становится больше объёма обмена с Западом. В летописи этот момент сформулирован как превращение сети в «реально российскую».","en":"Traffic exchanged inside Russia exceeds traffic going to and from the West. The chronicle marks this as the point at which the network becomes effectively Russian."},"links":[]},{"date":{"ru":"июль","en":"July"},"text":{"ru":"«Релком» участвует в Internet Society и начинает использовать выделенный канал Москва—Таллин—Хельсинки.","en":"Relcom participates in the Internet Society and begins using a dedicated Moscow–Tallinn–Helsinki link."},"links":[{"label":"Internet Society","url":"https://www.internetsociety.org/","archived":false}]},{"date":{"ru":"1991","en":"1991"},"text":{"ru":"Осваивается C-News — межузловое распространение материалов телеконференций — и вводится первая версия почтового сервера телеконференций.","en":"C-News is adopted for inter-node distribution of newsgroup material, and the first version of an e-mail-based conference server is introduced."},"links":[]},{"date":{"ru":"конец года","en":"Year end"},"text":{"ru":"В «Релкоме» представлены крупные города России, некоторые страны СНГ и Балтии.","en":"Relcom now includes major Russian cities as well as locations in some CIS and Baltic countries."},"links":[]},{"date":{"ru":"конец года","en":"Year end"},"text":{"ru":"Институт коммерческой инженерии начинает проект «ИнфоРынок». relcom.infomarket.talk и relcom.infomarket.quote названы первыми российскими русскоязычными телеконференциями, рассчитанными не на программистов.","en":"The Institute of Commercial Engineering starts InfoMarket. relcom.infomarket.talk and relcom.infomarket.quote are described as the first Russian-language Russian newsgroups aimed beyond programmers."},"links":[]}]},{"year":1992,"summary":{"ru":"EUnet/Relcom, on-line IP, RELARN, FTP-архивы и первые русские серверы за рубежом.","en":"EUnet/Relcom, online IP, RELARN, FTP archives and early Russian servers abroad."},"events":[{"date":{"ru":"июль","en":"July"},"text":{"ru":"«Релком» официально регистрируется в панъевропейской EUnet как EUnet/Relcom; в летописи сеть названа крупнейшей на европейском континенте. Создано АО «Релком».","en":"Relcom is officially registered in the pan-European EUnet as EUnet/Relcom; the chronicle describes it as the largest network on the European continent. Relcom becomes a joint-stock company."},"links":[{"label":"EUnet/Relcom","url":"http://www.relcom.eu.net/History/","archived":true}]},{"date":{"ru":"середина года","en":"Mid-year"},"text":{"ru":"АО «Релком» начинает экспериментальное внедрение on-line IP, позволяющего работать в реальном времени и использовать сервисы помимо электронной почты.","en":"Relcom begins experimental deployment of online IP, enabling real-time connectivity and services beyond e-mail."},"links":[]},{"date":{"ru":"середина года","en":"Mid-year"},"text":{"ru":"Начинается создание научной некоммерческой сети RELARN. Новый канал на Запад через Амстердам примерно в четыре раза увеличивает пропускную способность.","en":"Work begins on the non-commercial academic network RELARN. A new western link through Amsterdam increases bandwidth by roughly four times."},"links":[{"label":"RELARN","url":"http://www.relarn.ru/","archived":true}]},{"date":{"ru":"1992","en":"1992"},"text":{"ru":"Сергей Наумов создаёт в США «Внуков Даждьбога» — сначала FTP-архив материалов о русском язычестве, с весны 1993 года переведённый на WWW.","en":"Sergey Naumov creates Grandchildren of Dazhdbog in the US — initially an FTP archive about Russian paganism, moved to the Web in spring 1993."},"links":[{"label":"Внуки Даждьбога","url":"http://metalab.unc.edu/","archived":true}]},{"date":{"ru":"сентябрь","en":"September"},"text":{"ru":"Вадим Маслов открывает в США «СовИнформБюро» — первый, по летописи, целиком русский сервер за границей; сначала FTP-архив, с лета 1993 года — WWW.","en":"Vadim Maslov opens SovInformBuro in the US, described as the first entirely Russian server abroad; first an FTP archive, then on the Web from summer 1993."},"links":[{"label":"СовИнформБюро","url":"http://www.siber.com/","archived":true}]},{"date":{"ru":"октябрь","en":"October"},"text":{"ru":"Впервые организуется оперативное распространение по сети электронных версий «Известий» и некоторых других российских периодических изданий.","en":"Electronic versions of Izvestia and several other Russian periodicals begin to be distributed rapidly over the network."},"links":[]},{"date":{"ru":"октябрь","en":"October"},"text":{"ru":"Евгений Пескин основывает Eugene’s Electronic Library — FTP-архив свободно распространяемой литературы; в 1994 году проект переходит на WWW и русскоязычные тексты.","en":"Evgeny Peskin founds Eugene’s Electronic Library, an FTP archive of freely distributed literature; in 1994 it moves to the Web and Russian-language texts."},"links":[{"label":"Eugene’s Electronic Library","url":"http://www.online.ru/","archived":true}]}]},{"year":1993,"summary":{"ru":"Demos Online и официальное подключение EUnet/Relcom к Интернету.","en":"Demos Online and the formal Internet connection of EUnet/Relcom."},"events":[{"date":{"ru":"ноябрь","en":"November"},"text":{"ru":"Начинается проект Demos Online. Первые пользователи у «Демоса» появляются в сентябре 1994 года; позднее компания становится одним из крупнейших российских провайдеров.","en":"The Demos Online project begins. Demos gets its first users in September 1994; the company later becomes one of Russia’s largest providers."},"links":[{"label":"Demos Online","url":"http://www.dol.ru/","archived":true}]},{"date":{"ru":"конец года","en":"Year end"},"text":{"ru":"Сеть EUnet/Relcom официально подключена к Интернету.","en":"The EUnet/Relcom network is officially connected to the Internet."},"links":[]}]},{"year":1994,"summary":{"ru":"Домен .RU, первые WWW-проекты, электронная библиотека, RUNNet и M9-IX.","en":"The .RU domain, early Web projects, an electronic library, RUNNet and M9-IX."},"events":[{"date":{"ru":"17 марта","en":"17 March"},"text":{"ru":"Зарегистрирован домен .RU; Горный предлагает считать эту дату началом существования российского Интернета. Запущен WWW-сервер Relcom.","en":"The .RU domain is registered; Gorny suggests treating this date as the beginning of the Russian Internet. Relcom launches a Web server."},"links":[{"label":"www.relcom.ru","url":"http://www.relcom.ru/","archived":true}]},{"date":{"ru":"4 августа","en":"4 August"},"text":{"ru":"Открывается «Московский Либертариум» Института коммерческой инженерии — проект информационной поддержки общественной деятельности и исследований либертарианства.","en":"The Moscow Libertarium opens as a project of the Institute of Commercial Engineering, initially supporting civic activity and research on libertarianism."},"links":[{"label":"Московский Либертариум","url":"http://www.libertarium.ru/","archived":true}]},{"date":{"ru":"ноябрь","en":"November"},"text":{"ru":"Появляется будущая Библиотека Мошкова — первая полнотекстовая электронная русская библиотека.","en":"The future Moshkov Library appears, described as the first full-text electronic Russian library."},"links":[{"label":"Библиотека Мошкова","url":"https://www.lib.ru/","archived":false}]},{"date":{"ru":"конец года","en":"Year end"},"text":{"ru":"Открывается Window-To-Russia — каталог русских и связанных с Россией интернет-ресурсов. В рамках программы «Университеты России» начинается создание будущей сети RUNNet.","en":"Window-To-Russia opens as a directory of Russian and Russia-related Internet resources. The future RUNNet begins under the Universities of Russia program."},"links":[{"label":"Window-To-Russia","url":"http://www.wtr.ru/","archived":true},{"label":"RUNNet","url":"http://www.runnet.ru/","archived":true}]},{"date":{"ru":"конец года","en":"Year end"},"text":{"ru":"По инициативе МГУ при поддержке крупных провайдеров создаётся M9-IX — первый в России узел обмена IP-трафиком.","en":"At Moscow State University’s initiative, with support from major providers, M9-IX is created as Russia’s first IP traffic exchange point."},"links":[]}]},{"year":1995,"summary":{"ru":"Интерактивная литература, электронные СМИ, каталоги, правовая база и массовый коммерческий доступ.","en":"Interactive literature, electronic media, directories, legal databases and mass commercial access."},"events":[{"date":{"ru":"январь","en":"January"},"text":{"ru":"Выходят первые русские книги об Интернете: руководство «Релкома» по электронной почте в MS-DOS и «Введение в WWW» Константина Окраинца.","en":"The first Russian books about the Internet appear: Relcom’s guide to e-mail in MS-DOS and Konstantin Okrainets’s Introduction to the WWW."},"links":[]},{"date":{"ru":"февраль","en":"February"},"text":{"ru":"«Буриме» Дмитрия Манина названо первой русскоязычной игрой в Интернете и первой полностью интерактивной страницей русской Сети.","en":"Dmitry Manin’s Burime is described as the first Russian-language Internet game and the first fully interactive page of the Russian Web."},"links":[{"label":"Буриме","url":"http://kulichki.com/","archived":true}]},{"date":{"ru":"конец марта","en":"Late March"},"text":{"ru":"Открывается «Жалобная книга “Буриме”» — первая русскоязычная webboard, где пользователи могут обмениваться репликами прямо на WWW-странице.","en":"The Burime Complaint Book opens, described as the first Russian-language webboard, allowing users to exchange messages directly on a Web page."},"links":[{"label":"Жалобная книга","url":"http://kulichki.com/","archived":true}]},{"date":{"ru":"март — май","en":"March–May"},"text":{"ru":"«Учительская газета» первой среди газет делает электронную версию; DeLitZyne становится первым русскоязычным электронным журналом; РосБизнесКонсалтинг первым среди российских информагентств запускает собственный сервер.","en":"Uchitelskaya Gazeta becomes the first newspaper to create an electronic edition; DeLitZyne becomes the first Russian-language electronic magazine; RBC is the first Russian news agency to launch its own server."},"links":[{"label":"Учительская газета","url":"http://www.ug.ru/","archived":false},{"label":"РосБизнесКонсалтинг","url":"http://www.rbc.ru/","archived":false}]},{"date":{"ru":"май","en":"May"},"text":{"ru":"Стартует «Комкон», предоставляющий бесплатное размещение прежде всего русскоязычным некоммерческим проектам; первым становится электронная библиотека-FTP.","en":"Komkon launches, offering free hosting primarily to Russian-language non-commercial projects; an electronic FTP library is the first."},"links":[{"label":"Комкон","url":"http://www.komkon.org/","archived":true}]},{"date":{"ru":"16 августа","en":"16 August"},"text":{"ru":"В Интернете появляется первая база данных по российскому законодательству фирмы «Инфорис», позднее laws.ru.","en":"The first online database of Russian legislation appears, created by Inforis and later known as laws.ru."},"links":[{"label":"laws.ru","url":"http://www.laws.ru/","archived":true}]},{"date":{"ru":"сентябрь","en":"September"},"text":{"ru":"«Демос» открывает каталог Russia on the Net и двуязычный онлайн-журнал CrazyWEB; «Россия-Он-Лайн» становится первым массовым коммерческим провайдером.","en":"Demos opens the Russia on the Net directory and bilingual online magazine CrazyWEB; Russia-On-Line becomes the first mass commercial provider."},"links":[{"label":"Russia on the Net","url":"http://www.ru/","archived":true},{"label":"CrazyWEB","url":"http://www.crazyweb.ru/","archived":true},{"label":"Россия-Он-Лайн","url":"http://www.online.ru/","archived":true}]},{"date":{"ru":"10 октября","en":"10 October"},"text":{"ru":"POMAH Романа Лейбова, Леонида Делицына и Дмитрия Манина назван первым интерактивным литературным проектом после «Буриме» и первым опытом сетевой прозы.","en":"POMAH by Roman Leibov, Leonid Delitsyn and Dmitry Manin is described as the first interactive literary project after Burime and the first experiment in network prose."},"links":[{"label":"POMAH","url":"http://www.cs.ut.ee/","archived":true}]},{"date":{"ru":"октябрь — декабрь","en":"October–December"},"text":{"ru":"Проект «Россия: выборы-95» публикует информацию о ходе выборов в реальном времени.","en":"The Russia: Elections ’95 project publishes election information online in real time."},"links":[{"label":"Россия: выборы-95","url":"http://www.ice.ru/","archived":true}]},{"date":{"ru":"8 / 21 ноября","en":"8 / 21 November"},"text":{"ru":"Запускаются «Анекдоты из России» Дмитрия Вернера и сервер веб-издательства «Инфоарт».","en":"Dmitry Verner’s Anecdotes from Russia and the Infoart Web publishing server are launched."},"links":[{"label":"Анекдоты из России","url":"https://www.anekdot.ru/","archived":false},{"label":"Инфоарт","url":"http://www.infoart.ru/","archived":true}]},{"date":{"ru":"конец года","en":"Year end"},"text":{"ru":"Начинается проект «Деловая сеть России». IREX запускает программу расширения доступа к Интернету: на первом этапе открываются 64 точки общего доступа в странах СНГ.","en":"Work begins on the Business Network of Russia. IREX launches its Internet access expansion program; its first stage opens 64 public access points across CIS countries."},"links":[{"label":"IREX","url":"http://www.irex.ru/","archived":true}]}]},{"year":1996,"summary":{"ru":"RBnet, интернет-кафе, сетевые журналы, реклама, поисковики и складывающееся интернет-сообщество.","en":"RBnet, Internet cafés, online magazines, advertising, search engines and a forming Internet community."},"events":[{"date":{"ru":"1996","en":"1996"},"text":{"ru":"Начинается межведомственная программа национальной сети для науки и высшей школы; позднее она получает название RBnet.","en":"An interdepartmental program begins to build a national network for science and higher education; it is later named RBnet."},"links":[]},{"date":{"ru":"18 января","en":"18 January"},"text":{"ru":"В Санкт-Петербурге открывается «Тетрис» — первое в России интернет-кафе.","en":"Tetris opens in St Petersburg, described as Russia’s first Internet café."},"links":[{"label":"Тетрис","url":"http://www.dux.ru/","archived":true}]},{"date":{"ru":"февраль","en":"February"},"text":{"ru":"Артемий Лебедев учреждает НЖМД — первую российскую награду за WWW-страницы. В Петербурге начинает выходить Internet Jornal — первый русский журнал, целиком посвящённый Интернету.","en":"Artemy Lebedev establishes NZhMD, Russia’s first award for Web pages. In St Petersburg, Internet Jornal begins as the first Russian magazine devoted entirely to the Internet."},"links":[{"label":"НЖМД","url":"http://www.tema.ru/","archived":true}]},{"date":{"ru":"март — апрель","en":"March–April"},"text":{"ru":"Появляются Human Resources Online и «Журнальный зал»; стартует программа «Университетские центры Интернет». Радио 101 открывает сайт и начинает параллельную интернет-трансляцию.","en":"Human Resources Online and Magazine Hall appear; the University Internet Centers program begins. Radio 101 opens a website and starts simultaneous Internet broadcasting."},"links":[{"label":"Human Resources Online","url":"http://www.hro.ru/","archived":true},{"label":"Журнальный зал","url":"http://magazines.russ.ru/","archived":true},{"label":"Радио 101","url":"http://www.101.ru/","archived":true}]},{"date":{"ru":"май — июнь","en":"May–June"},"text":{"ru":"Создаётся РОЦИТ. Начинает работу конкурс русской сетевой литературы «Тенета». Компания «Стек» начинает работу над Rambler.","en":"ROCIT is created. The Teneta competition for Russian network literature begins. The company Stack starts work on Rambler."},"links":[{"label":"РОЦИТ","url":"http://www.rocit.ru/","archived":false},{"label":"Тенета","url":"http://www.teneta.ru/","archived":true},{"label":"Rambler","url":"http://www.rambler.ru/","archived":false}]},{"date":{"ru":"15 июня — август","en":"15 June–August"},"text":{"ru":"Открывается «Сумасшедший Дом Мистера Паркера». Частные страницы «Симплекс» и «СовИнформБюро» первыми размещают рекламу за деньги; выборы президента освещаются через WWW Национальной службой новостей; появляется рекламная сеть Sputnik.","en":"Mr Parker’s Madhouse opens. Simplex and SovInformBuro become the first private pages to carry paid advertising; the presidential election is covered online by the National News Service; the Sputnik advertising network appears."},"links":[{"label":"Сумасшедший Дом Мистера Паркера","url":"http://www.parker.ru/","archived":true},{"label":"Национальная служба новостей","url":"http://www.nns.ru/","archived":true}]},{"date":{"ru":"9–10 сентября","en":"9–10 September"},"text":{"ru":"Открываются Cooking.ru и «Чертовы Кулички». «Кулички» становятся первым сервером, предоставляющим бесплатный хостинг русскоязычным авторским проектам.","en":"Cooking.ru and Chertovy Kulichki open. Kulichki becomes the first server to provide free hosting to Russian-language author projects."},"links":[{"label":"Cooking.ru","url":"http://www.cooking.ru/","archived":false},{"label":"Чертовы Кулички","url":"http://kulichki.com/","archived":false}]},{"date":{"ru":"2–24 октября","en":"2–24 October"},"text":{"ru":"Выходит первый номер Zhurnal.ru — «Вестника сетевой культуры». «Серебряный Дождь» начинает круглосуточное интернет-вещание; Лебедев открывает WebDesign; Zhurnal.ru проводит первую российскую онлайн-конференцию в IRC.","en":"The first issue of Zhurnal.ru, a Bulletin of Network Culture, appears. Silver Rain begins continuous Internet broadcasting; Lebedev opens WebDesign; Zhurnal.ru organizes the first Russian online conference in IRC."},"links":[{"label":"Zhurnal.ru","url":"http://www.zhurnal.ru/","archived":true},{"label":"WebDesign","url":"http://www.design.ru/","archived":true}]},{"date":{"ru":"27 октября — ноябрь","en":"27 October–November"},"text":{"ru":"В Zhurnal.ru открывается Hack Zone — площадка открытого разговора о компьютерной безопасности. Начинает выходить «Паравозов-News». CompTek представляет русифицированный поиск AltaVista с учётом морфологии.","en":"Zhurnal.ru opens Hack Zone for public discussion of computer security. Paravozov-News begins. CompTek presents a Russian-language AltaVista search adapted for morphology."},"links":[{"label":"Hack Zone","url":"http://www.zhurnal.ru/","archived":true},{"label":"CompTek","url":"http://www.comptek.ru/","archived":false}]},{"date":{"ru":"ноябрь — декабрь","en":"November–December"},"text":{"ru":"Rambler вводится в действие и быстро обходит другие русские поисковики. Представлен каталог, будущий «Ау!». Открывается первая «Кроватка»; на рынок выходит Cityline, использующий популярные контент-проекты для продвижения.","en":"Rambler goes live and quickly overtakes other Russian search engines. A directory later named Au! is presented. The first Krovatka chat site opens, and Cityline enters the market using popular content projects for promotion."},"links":[{"label":"Rambler","url":"http://www.rambler.ru/","archived":false},{"label":"Кроватка","url":"http://www.krovatka.ru/","archived":true},{"label":"Cityline","url":"http://www.cityline.ru/","archived":true}]}]},{"year":1997,"summary":{"ru":"ICQ, сетевые обозрения, виртуальные личности, рейтинги, Яndex и новые электронные издания.","en":"ICQ, Web reviews, virtual identities, rankings, Yandex and new electronic publications."},"events":[{"date":{"ru":"январь","en":"January"},"text":{"ru":"Internet Jornal превращается в «Мир Internet»; Mirabilis выпускает первую версию ICQ; открывается электронная «Компьютерра». Выходит справочник «Жёлтые страницы Internet — 1997» примерно с 1500 ресурсами.","en":"Internet Jornal becomes Mir Internet; Mirabilis releases the first version of ICQ; an electronic Computerra opens. Yellow Pages Internet — 1997 appears with descriptions of roughly 1,500 resources."},"links":[{"label":"Mirabilis / ICQ","url":"http://www.mirabilis.com/","archived":true},{"label":"Компьютерра","url":"http://www.computerra.ru/","archived":false}]},{"date":{"ru":"17 января","en":"17 January"},"text":{"ru":"В Zhurnal.ru начинают выходить «Перелётные мухи» М. И. Мухина — еженедельные обозрения Паутины, заметно повлиявшие на русскую сетевую публицистику.","en":"M. I. Mukhin’s Migratory Flies begins in Zhurnal.ru as a weekly Web review that the chronicle credits with substantial influence on Russian online journalism."},"links":[{"label":"Перелётные мухи","url":"http://www.zhurnal.ru/muxin.htm","archived":true}]},{"date":{"ru":"30 января — 4 февраля","en":"30 January–4 February"},"text":{"ru":"«Открытые системы» начинают регулярные компьютерные новости; появляется список pogoda@; Cityline запускает TrubAddUrl, позднее переименованный в «Систему TAU».","en":"Open Systems begins regular computer-news publication; the pogoda@ mailing list appears; Cityline launches TrubAddUrl, later renamed the TAU System."},"links":[{"label":"Открытые системы","url":"https://www.osp.ru/","archived":false},{"label":"Система TAU","url":"http://www.design.ru/","archived":true}]},{"date":{"ru":"17 февраля","en":"17 February"},"text":{"ru":"Разоблачение Кати Деткиной становится первым громким скандалом русской Сети и вызывает дискуссии об авторстве, анонимности, виртуальности, этике, свободе и ответственности.","en":"The exposure of Katya Detkina becomes the first major scandal of the Russian Web and triggers debate about authorship, anonymity, virtual identity, ethics, freedom and responsibility."},"links":[{"label":"CrazyWeb","url":"http://www.crazyweb.ru/","archived":true}]},{"date":{"ru":"3–9 марта","en":"3–9 March"},"text":{"ru":"Открывается литературный журнал «Словесность» — будущая «Сетевая словесность». Появляется новая версия «Онейрократии», где сны можно записывать через онлайн-форму.","en":"The literary journal Slovesnost opens, later becoming Setevaya Slovesnost. A new version of Oneirocracy appears, allowing dreams to be submitted through an online form."},"links":[{"label":"Сетевая словесность","url":"https://www.netslova.ru/","archived":false},{"label":"Онейрократия","url":"http://www.cityline.ru/","archived":true}]},{"date":{"ru":"16–24 марта","en":"16–24 March"},"text":{"ru":"Проходит первый Российский Интернет Форум; начинается «Еже-движение»; запускается Rambler’s Top 100 со счётчиками посещений и рейтингом сайтов.","en":"The first Russian Internet Forum takes place; the Ezhe movement begins; Rambler’s Top 100 launches with visitor counters and site rankings."},"links":[{"label":"Российский Интернет Форум","url":"http://www.rif.ru/","archived":false},{"label":"Еже-движение","url":"http://www.ezhe.ru/","archived":true},{"label":"Rambler’s Top 100","url":"http://www.rambler.ru/","archived":false}]},{"date":{"ru":"май — июнь","en":"May–June"},"text":{"ru":"Начинают выходить End of The World News и «Русские кружева». NetSkate выпускает «Русскую новостную дорожку»; появляется русское зеркало ClickZ — специализированное издание об интернет-рекламе.","en":"End of The World News and Russian Lace begin. NetSkate releases the Russian News Ticker; a Russian mirror of ClickZ appears as a specialized publication about Internet advertising."},"links":[{"label":"End of The World News","url":"http://imperium.lenin.ru/","archived":true},{"label":"ClickZ","url":"http://www.zhurnal.ru/","archived":true}]},{"date":{"ru":"14–15 июля","en":"14–15 July"},"text":{"ru":"Открывается «Русский Журнал» — первый интернет-проект Фонда эффективной политики. «Инфоарт» объявляет о создании первых официально зарегистрированных русскоязычных push-каналов.","en":"Russky Zhurnal opens as the first Internet project of the Foundation for Effective Politics. Infoart announces the first officially registered Russian-language push channels."},"links":[{"label":"Русский Журнал","url":"http://russ.ru/","archived":true},{"label":"Инфоарт","url":"http://www.infoart.ru/","archived":true}]},{"date":{"ru":"август — сентябрь","en":"August–September"},"text":{"ru":"Выходит журнал Internet; запускается баннерная сеть Reklama.ru. 23 сентября официально открывается Яndex.ru с поиском, учитывающим морфологию русского языка.","en":"The magazine Internet appears; the Reklama.ru banner network launches. On 23 September Yandex.ru officially opens with search that accounts for Russian morphology."},"links":[{"label":"Reklama.ru","url":"http://www.reklama.ru/","archived":true},{"label":"Яndex","url":"http://www.yandex.ru/","archived":false}]},{"date":{"ru":"27 сентября — ноябрь","en":"27 September–November"},"text":{"ru":"Появляется интерактивная литературная игра «Сад расходящихся хокку». После взлома Rambler Top 100 система вводит более развёрнутые категории. В «Доме Мистера Паркера» открывается проект «Летопись» для сохранения цитат русской Сети.","en":"The interactive literary game Garden of Forking Haiku appears. After Rambler Top 100 is hacked, the ranking introduces more detailed categories. Mr Parker’s site launches a Chronicle project preserving quotations from the Russian Web."},"links":[{"label":"Сад расходящихся хокку","url":"https://hokku.netslova.ru/","archived":false},{"label":"Rambler","url":"http://www.rambler.ru/","archived":false}]}]},{"year":1998,"summary":{"ru":"Сетевое искусство, политический Интернет, интернет-радио, СОРМ-2, кризис и рост аудитории.","en":"Net art, political Internet, Internet radio, SORM-2, the financial crisis and audience growth."},"events":[{"date":{"ru":"5–20 января","en":"5–20 January"},"text":{"ru":"Начинает выходить «Бессрочная ссылка» Романа Лейбова. Тимофей Бокарев открывает Tim Promotion, позднее Promo.Ru; появляется каталог PSyberLink по психологии и социальным наукам.","en":"Roman Leibov’s Bessrochnaya Ssylka begins. Timofey Bokarev opens Tim Promotion, later Promo.Ru; the PSyberLink directory for psychology and the social sciences appears."},"links":[{"label":"Бессрочная ссылка","url":"http://old.russ.ru/","archived":true},{"label":"Promo.Ru","url":"http://www.promo.ru/","archived":false}]},{"date":{"ru":"18 февраля","en":"18 February"},"text":{"ru":"В Zhurnal.ru открывается «Полит.ру» — ежедневные политические новости под редакцией Андрея Левкина.","en":"Polit.ru opens within Zhurnal.ru as a daily political-news project edited by Andrey Levkin."},"links":[{"label":"Полит.ру","url":"http://www.polit.ru/","archived":false}]},{"date":{"ru":"16–31 марта","en":"16–31 March"},"text":{"ru":"Открываются официальный и неформальный сайты Бориса Немцова — ранний опыт «политического Интернета». Происходит первая интернет-перепалка действующих российских политиков.","en":"Official and informal Boris Nemtsov sites open as an early experiment in the “political Internet.” The first online clash between serving Russian politicians follows."},"links":[{"label":"официальный сайт Немцова","url":"http://www.nemtsov.ru/","archived":true},{"label":"форум Glasnet","url":"http://www.glasnet.ru/","archived":true}]},{"date":{"ru":"март — апрель","en":"March–April"},"text":{"ru":"Подводятся итоги первого фестиваля арт-ресурсов «Да-да-нет». В Русском Журнале появляются «Net-культура» и «Сетевая жизнь»; Zhurnal.ru открывает рубрику Net Art Алексея Шульгина; запускается VRML-проект «Виртуальный Мавзолей Ленина».","en":"The first Da-Da-Net festival of art resources announces its results. Russky Zhurnal opens Net Culture and Network Life; Zhurnal.ru launches Alexei Shulgin’s Net Art section; the VRML project Virtual Lenin Mausoleum opens."},"links":[{"label":"Да-да-нет","url":"http://www.da-da-net.ru/","archived":true},{"label":"Net-культура","url":"http://old.russ.ru/","archived":true},{"label":"Net Art","url":"http://www.zhurnal.ru/","archived":true},{"label":"Виртуальный Мавзолей Ленина","url":"http://www.lenin.ru/","archived":true}]},{"date":{"ru":"апрель — май","en":"April–May"},"text":{"ru":"Радио 101 расширяет интернет-вещание; появляется RadioNet — первая в России радиопрограмма только для Интернета. Борис Ельцин участвует в интернет-пресс-конференции на #msnbc.","en":"Radio 101 expands its Internet broadcasting; RadioNet appears as Russia’s first radio program made only for the Internet. Boris Yeltsin takes part in an Internet press conference on #msnbc."},"links":[{"label":"Радио 101","url":"http://www.101.ru/","archived":true}]},{"date":{"ru":"23–28 июня","en":"23–28 June"},"text":{"ru":"Проходит первая российская конференция по интернет-маркетингу. «Московский Либертариум» открывает раздел о СОРМ-2, выводя проблему сетевого наблюдения в публичное обсуждение.","en":"Russia’s first conference on Internet marketing takes place. Moscow Libertarium opens a section on SORM-2, bringing network surveillance into public discussion."},"links":[{"label":"Московский Либертариум","url":"http://www.ice.ru/","archived":true}]},{"date":{"ru":"июнь","en":"June"},"text":{"ru":"Исследование IDC оценивает число пользователей российского Интернета в 1,2 млн человек; для сравнения летопись приводит 384 тыс. в 1996 году.","en":"An IDC study estimates the Russian Internet audience at 1.2 million users; the chronicle compares this with 384,000 in 1996."},"links":[]},{"date":{"ru":"17 августа","en":"17 August"},"text":{"ru":"Финансовый кризис резко увеличивает спрос на финансово-политическую информацию. РБК становится главным источником такого трафика и несколько раз расширяет канал.","en":"The financial crisis sharply increases demand for financial and political information. RBC becomes the leading source for this traffic and repeatedly expands its connection capacity."},"links":[{"label":"РБК","url":"http://www.rbc.ru/","archived":false}]},{"date":{"ru":"август — октябрь","en":"August–October"},"text":{"ru":"Открывается сервер «Современное искусство в Сети»; Фонд «Евразия» поддерживает 14 русскоязычных интернет-проектов; запускается «Кирилл и Мефодий: Знания обо всём».","en":"The Contemporary Art on the Web server opens; the Eurasia Foundation funds 14 Russian-language Internet projects; Kirill & Mefodiy: Knowledge About Everything launches."},"links":[{"label":"Современное искусство в Сети","url":"http://www.guelman.ru/","archived":true},{"label":"Кирилл и Мефодий","url":"http://www.km.ru/","archived":false}]},{"date":{"ru":"1 ноября","en":"1 November"},"text":{"ru":"Открывается бесплатная почтовая служба Mail.ru. Последующую продажу 20% Port.ru иностранным инвесторам Горный называет первой крупной сделкой в российском Интернете.","en":"The free Mail.ru service opens. Gorny describes the later sale of 20% of Port.ru to foreign investors as the first major deal in the Russian Internet."},"links":[{"label":"Mail.ru","url":"http://www.mail.ru/","archived":false}]},{"date":{"ru":"27 ноября","en":"27 November"},"text":{"ru":"На бесплатном сервере people.weekend.ru появляется «Коготь» — собрание компрометирующих материалов. Горный называет его первым примером использования Сети для «слива компромата»; уже на следующий день сайт закрывают, но копии расходятся по другим серверам.","en":"Kogot appears on the free people.weekend.ru server as a collection of compromising materials. Gorny calls it the first example of using the Web to leak kompromat; the site is closed the next day, but copies spread to other servers."},"links":[{"label":"Коготь","url":"http://people.weekend.ru/","archived":true}]},{"date":{"ru":"декабрь","en":"December"},"text":{"ru":"По отчёту РОЦИТ число российских пользователей Интернета к концу года составляет около 1,5 млн; действует более 300 провайдеров и создано свыше 26 тысяч информационных ресурсов.","en":"According to a ROCIT report, Russia has about 1.5 million Internet users by year’s end, more than 300 providers and over 26,000 information resources."},"links":[{"label":"РОЦИТ","url":"http://www.rocit.ru/","archived":true}]}]},{"year":1999,"summary":{"ru":"Ежедневные онлайн-медиа, политические проекты, авторское право, статистика и превращение Рунета в массовое информационное пространство.","en":"Daily online media, political projects, copyright, metrics and the transformation of Runet into a mass information space."},"events":[{"date":{"ru":"22–27 января","en":"22–27 January"},"text":{"ru":"Яndex вводит еженедельный НИНИ-индекс изменений пользовательских интересов. Выходит первый выпуск «Правды-Интернет», будущей «Правды.ру».","en":"Yandex introduces the weekly NINI index tracking changes in user interests. The first issue of Pravda-Internet, later Pravda.ru, appears."},"links":[{"label":"Яndex","url":"http://www.yandex.ru/","archived":false},{"label":"Правда.ру","url":"http://www.pravda.ru/","archived":false}]},{"date":{"ru":"1–18 февраля","en":"1–18 February"},"text":{"ru":"В Петербурге проходит конференция «Интернет. Общество. Личность». Открывается «Интернет-парламент» Сергея Кириенко и ФЭП; публикуется анонимный компроматный сайт «Коготь-2».","en":"St Petersburg hosts the Internet. Society. Personality conference. Sergey Kiriyenko and the Foundation for Effective Politics open the Internet Parliament; the anonymous kompromat site Kogot-2 appears."},"links":[{"label":"Интернет-парламент","url":"http://www.elections.ru/","archived":true},{"label":"Коготь-2","url":"http://www.krasnobykow.com/","archived":true}]},{"date":{"ru":"1–13 марта","en":"1–13 March"},"text":{"ru":"Выходит первая российская ежедневная интернет-газета Gazeta.ru: главный редактор Антон Носик, дизайн Артемия Лебедева, программирование Максима Мошкова. Вслед за ложной новостью о смерти губернатора Петербурга обсуждается Интернет как среда дезинформации; проходит третий РИФ.","en":"Gazeta.ru launches as Russia’s first daily Internet newspaper, edited by Anton Nosik, designed by Artemy Lebedev and programmed by Maxim Moshkov. A false report about the St Petersburg governor fuels debate about online disinformation; the third RIF takes place."},"links":[{"label":"архив Gazeta.ru","url":"http://www.gazeta.msk.ru/","archived":true},{"label":"РИФ","url":"http://www.rif.ru/","archived":false}]},{"date":{"ru":"март","en":"March"},"text":{"ru":"Тема сетевой элиты становится предметом рейтингов и проектов: журнал Internet публикует «108 лучших русской Сети», а Горный и Шерман открывают «Инфократию».","en":"The idea of a network elite becomes the subject of rankings and projects: Internet magazine publishes “108 Best of the Russian Web,” while Gorny and Sherman launch Infocracy."},"links":[{"label":"Инфократия","url":"http://www.guelman.ru/","archived":true}]},{"date":{"ru":"апрель — май","en":"April–May"},"text":{"ru":"ФЭП использует сайт «Мы — за Барака!» как инструмент предвыборной агитации в Израиле. Студия Артемия Лебедева запускает баннерную сеть RB2, быстро достигшую миллиона показов в сутки.","en":"The Foundation for Effective Politics uses the We Are for Barak! site as an election-campaign tool in Israel. Artemy Lebedev Studio launches the RB2 banner network, quickly reaching one million impressions per day."},"links":[{"label":"Студия Артемия Лебедева","url":"http://www.design.ru/","archived":true}]},{"date":{"ru":"май — июнь","en":"May–June"},"text":{"ru":"Подводятся итоги «Да-Да-Net’99» и фестиваля Trash Art. Каталог «Ау!» запускает бесплатную почту Au.ru и вскоре становится @Rus. Статья «Трест Рунет» провоцирует спор о контроле влиятельных сетевых СМИ финансовыми группами.","en":"Da-Da-Net ’99 and the Trash Art festival announce their results. The Au! directory launches free e-mail and soon becomes @Rus. The article Runet Trust triggers debate about financial groups controlling influential online media."},"links":[{"label":"Да-Да-Net’99","url":"http://www.da-da-net.ru/","archived":true},{"label":"@Rus","url":"http://www.atrus.ru/","archived":true}]},{"date":{"ru":"15–28 июля","en":"15–28 July"},"text":{"ru":"После публикации Gazeta.ru сведения об эпидемии в Ростовской области подхватывают ведущие СМИ — один из ранних случаев, когда сетевой ресурс становится исходным источником новости. Скандал вокруг «Голубого сала» Владимира Сорокина перерастает в дискуссию об авторском праве в Интернете.","en":"After Gazeta.ru reports an epidemic in the Rostov region, leading media follow — an early case of an online resource becoming the original source of a story. The dispute over Vladimir Sorokin’s Blue Lard expands into a debate about Internet copyright."},"links":[]},{"date":{"ru":"28 июля","en":"28 July"},"text":{"ru":"Открывается сайт Информационно-поисковой службы уголовного розыска Санкт-Петербурга — для поиска пропавших без вести, преступников и опознания неопознанных тел.","en":"The St Petersburg Criminal Investigation Department opens an information-search website for missing persons, wanted criminals and identification of unknown bodies."},"links":[{"label":"Уголовный розыск Санкт-Петербурга","url":"http://www.ugro.spb.ru/","archived":true}]},{"date":{"ru":"19 августа — 4 сентября","en":"19 August–4 September"},"text":{"ru":"Яndex вводит «семейный» поиск. «Независимая газета» начинает полностью публиковать материалы в свободном доступе. Проходит награждение «Тенета-Ринет’98», запускается круглосуточная Lenta.ru.","en":"Yandex introduces family search. Nezavisimaya Gazeta begins publishing its full contents freely online. The Teneta-Rinet ’98 awards are held and the round-the-clock Lenta.ru launches."},"links":[{"label":"семейный поиск","url":"http://family.yandex.ru/","archived":true},{"label":"Независимая газета","url":"http://www.ng.ru/","archived":false},{"label":"Тенета","url":"http://www.teneta.ru/","archived":true},{"label":"Lenta.ru","url":"http://www.lenta.ru/","archived":false}]},{"date":{"ru":"сентябрь","en":"September"},"text":{"ru":"Открывается Monitoring.ru для регулярных исследований российской web-аудитории. Появляются «Утро» и Союз операторов Интернет.","en":"Monitoring.ru opens for regular studies of the Russian Web audience. Utro and the Union of Internet Operators also appear."},"links":[{"label":"Monitoring.ru","url":"http://www.monitoring.ru/","archived":true},{"label":"Утро","url":"http://www.utro.ru/","archived":false}]},{"date":{"ru":"октябрь","en":"October"},"text":{"ru":"Открываются СМИ.Ру и Vesti.ru. Завершается программа «Университетские центры Интернет»: создано 33 университетских центра с выходом в Интернет.","en":"SMI.ru and Vesti.ru open. The University Internet Centers program concludes after creating Internet-equipped centers at 33 Russian universities."},"links":[{"label":"СМИ.Ру","url":"http://www.smi.ru/","archived":true},{"label":"Vesti.ru","url":"http://www.vesti.ru/","archived":false}]},{"date":{"ru":"9–29 ноября","en":"9–29 November"},"text":{"ru":"«Интернить’99» становится площадкой разговора интернет-сообщества с правительством. Начинают выходить Internet.ru и eMedia; открывается SpyLOG — система интернет-статистики.","en":"Internit ’99 becomes a venue for dialogue between the Internet community and government. Internet.ru and eMedia begin publishing; SpyLOG opens as an Internet statistics service."},"links":[{"label":"Internet.ru","url":"http://internet.ru/","archived":true},{"label":"eMedia","url":"http://www.emedia.ru/","archived":true},{"label":"SpyLOG","url":"http://spylog.ru/","archived":true}]},{"date":{"ru":"ноябрь — декабрь","en":"November–December"},"text":{"ru":"Monitoring.ru оценивает аудиторию российского Интернета примерно в 5,4 млн человек, около 5% взрослого населения; более 40% начали пользоваться Сетью в этом году. Создаются Российская Академия Интернет и Русская виртуальная библиотека.","en":"Monitoring.ru estimates the Russian Internet audience at about 5.4 million people, around 5% of the adult population; more than 40% began using the Internet that year. The Russian Academy of the Internet and the Russian Virtual Library are created."},"links":[{"label":"Русская виртуальная библиотека","url":"http://www.rvb.ru/","archived":false}]},{"date":{"ru":"декабрь","en":"December"},"text":{"ru":"Открывается Internet Media House Russia; выигран первый судебный иск о плагиате из Интернета. В день выборов сайт Elections99.com публикует exit polls и становится одним из самых заметных проектов политического Рунета.","en":"Internet Media House Russia opens; the first court case over plagiarism from the Internet is won. On election day Elections99.com publishes exit polls and becomes one of the most prominent projects of political Runet."},"links":[{"label":"Elections99.com","url":"http://www.elections99.com/","archived":true}]},{"date":{"ru":"19–29 декабря","en":"19–29 December"},"text":{"ru":"Elections99.com публикует exit polls в день думских выборов и становится одним из самых громких проектов политического Рунета. В конце месяца Владимир Путин встречается с представителями интернет-сообщества, а РосНИИРОС объявляет о снижении цены регистрации домена.","en":"Elections99.com publishes exit polls on parliamentary election day and becomes one of the loudest projects of political Runet. At month’s end Vladimir Putin meets representatives of the Internet community, while RosNIIROS announces a cut in domain-registration fees."},"links":[{"label":"Elections99.com","url":"http://www.elections99.com/","archived":true},{"label":"РосНИИРОС","url":"http://www.ripn.net/","archived":true}]}]}];

const yearNav=document.getElementById("yearNav");

function archiveHref(original) {
  const normalized=/^https?:\/\//i.test(original) ? original : "http://"+original;
  return "https://web.archive.org/web/*/"+normalized;
}

function projectLink(link) {
  return `<a
    class="project"
    href="${archiveHref(link.url)}"
    target="_blank"
    rel="noopener"
    title="Wayback Machine: ${link.url}"
  >${link.label} ↗</a>`;
}

function columnCount(n) {
  if (n <= 5) return 1;
  if (n <= 8) return 2;
  return 3;
}

function splitChronologically(items, count) {
  const result=[];
  const base=Math.floor(items.length/count);
  const extra=items.length%count;
  let cursor=0;

  for(let c=0;c<count;c++) {
    const size=base+(c<extra?1:0);
    result.push(items.slice(cursor,cursor+size));
    cursor+=size;
  }
  return result;
}

function eventHtml(ev) {
  const links=(ev.links||[]).map(projectLink).join("");
  return `<li class="event">
    <div class="event-date">${ev.date[state.lang]}</div>
    <div class="event-copy">
      ${ev.text[state.lang]}
      ${links?`<div class="links">${links}</div>`:""}
    </div>
  </li>`;
}

function render() {
  track.innerHTML="";
  yearNav.innerHTML="";

  DATA.forEach((entry,index)=>{
    const nav=document.createElement("button");
    nav.type="button";
    nav.className="year-btn"+(index===state.current?" active":"");
    nav.textContent=entry.year;
    nav.addEventListener("click",()=>go(index));
    yearNav.appendChild(nav);

    const cols=columnCount(entry.events.length);
    const groups=splitChronologically(entry.events,cols);
    const columns=groups
      .map(group=>`<ol class="event-col">${group.map(eventHtml).join("")}</ol>`)
      .join("");

    const page=document.createElement("section");
    page.className="year-page";
    page.dataset.index=index;
    page.innerHTML=`
      <div class="year-layout">
        <aside class="year-aside">
          <div class="year-ghost" aria-hidden="true">${entry.year}</div>
          <h2 class="year-number">${entry.year}</h2>
          <div class="year-summary">${entry.summary[state.lang]}</div>
        </aside>
        <div class="event-columns cols-${cols}">
          ${columns}
        </div>
      </div>
    `;
    track.appendChild(page);
  });

  updateHeader();
  requestAnimationFrame(()=>go(state.current,false));
}

function updateHeader() {
  document.documentElement.lang=state.lang;

  document.getElementById("title").textContent=
    state.lang==="ru"
      ? "ЛЕТОПИСЬ РУССКОГО ИНТЕРНЕТА"
      : "CHRONICLE OF THE RUSSIAN INTERNET";

  document.getElementById("subtitle").innerHTML=
    state.lang==="ru"
      ? `интерактивный пересказ Летописи русского интернета <a class="author" href="https://www.netslova.ru/gorny/" target="_blank" rel="noopener">Евгения Горного</a>`
      : `an interactive retelling of the Chronicle of the Russian Internet by <a class="author" href="https://www.netslova.ru/gorny/" target="_blank" rel="noopener">Evgeny Gorny</a>`;

  document.getElementById("ru").classList.toggle("active",state.lang==="ru");
  document.getElementById("en").classList.toggle("active",state.lang==="en");

  document.querySelectorAll(".year-btn")
    .forEach((btn,i)=>btn.classList.toggle("active",i===state.current));
}

function animateYear(page) {
  if(!page) return;
  page.classList.remove("animate-year");
  void page.offsetWidth;
  page.classList.add("animate-year");
  window.setTimeout(()=>page.classList.remove("animate-year"),3500);
}

function go(index,smooth=true) {
  state.current=Math.max(0,Math.min(DATA.length-1,index));
  const pages=document.querySelectorAll(".year-page");

  pages[state.current]?.scrollIntoView({
    behavior:smooth?"smooth":"auto",
    inline:"start",
    block:"nearest"
  });

  animateYear(pages[state.current]);

  document.querySelectorAll(".year-btn")
    .forEach((btn,i)=>btn.classList.toggle("active",i===state.current));
}

document.getElementById("prev").addEventListener("click",()=>go(state.current-1));
document.getElementById("next").addEventListener("click",()=>go(state.current+1));
document.getElementById("ru").addEventListener("click",()=>{state.lang="ru";render()});
document.getElementById("en").addEventListener("click",()=>{state.lang="en";render()});

viewport.addEventListener("wheel",(e)=>{
  const page=e.target.closest(".year-page");
  const verticalIntent=Math.abs(e.deltaY)>=Math.abs(e.deltaX);

  if(page && verticalIntent){
    const canScrollDown=page.scrollTop+page.clientHeight < page.scrollHeight-2;
    const canScrollUp=page.scrollTop > 2;

    if((e.deltaY>0 && canScrollDown) || (e.deltaY<0 && canScrollUp)){
      // Let the year page consume the wheel event vertically.
      return;
    }

    // At the top/bottom boundary, continue through the timeline horizontally.
    e.preventDefault();
    viewport.scrollLeft+=e.deltaY;
    return;
  }

  if(Math.abs(e.deltaX)>0){
    e.preventDefault();
    viewport.scrollLeft+=e.deltaX;
  }
},{passive:false});

viewport.addEventListener("keydown",(e)=>{
  if(e.key==="ArrowRight"){e.preventDefault();go(state.current+1)}
  if(e.key==="ArrowLeft"){e.preventDefault();go(state.current-1)}
});

viewport.addEventListener("scroll",()=>{
  const pages=[...document.querySelectorAll(".year-page")];
  let closest=0;
  let distance=Infinity;

  pages.forEach((page,i)=>{
    const d=Math.abs(page.offsetLeft-viewport.scrollLeft);
    if(d<distance){
      distance=d;
      closest=i;
    }
  });

  if(closest!==state.current){
    state.current=closest;
    animateYear(pages[state.current]);
    document.querySelectorAll(".year-btn")
      .forEach((btn,i)=>btn.classList.toggle("active",i===state.current));
  }
});

render();
</script>
</body>
</html>
